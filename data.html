<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Data Table</title>
</head>
<body>

    <h2>Data Table</h2>

    <input type="text" id="searchBox" placeholder="Search by name..." oninput="displayData()">
    <br><br>

    <button onclick="sortByName()">Sort by Name</button>
    <button onclick="sortByAge()">Sort by Age</button>
    <br><br>

    <table border="1" cellpadding="8">
        <thead>
            <tr>
                <th>Name</th>
                <th>Age</th>
                <th>City</th>
            </tr>
        </thead>
        <tbody id="tableBody"></tbody>
    </table>

    <script src="data.js" defer></script>
</body>
</html>
